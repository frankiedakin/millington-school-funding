name: Import existing public site for review

on:
  push:
    branches: [import-existing-site]
    paths: ['.github/workflows/import-existing-site.yml']

permissions:
  contents: read

concurrency:
  group: import-existing-site
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/import-existing-site'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import-existing-site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and verify the saved public files
        run: node scripts/import-existing-site.mjs
      - name: Validate the complete website
        run: npm run check
      - name: Commit the verified original website
        run: |
          test "$GITHUB_REF" = 'refs/heads/import-existing-site'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site
          git diff --cached --quiet && exit 0
          git commit -m 'Import verified public website and source documents'
          git push origin HEAD:refs/heads/import-existing-site
